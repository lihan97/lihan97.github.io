short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I am an Assistant Professor at the <b>School of Mathematical Sciences, Nankai University</b>. I received my Ph.D. from the <b>Institute for Interdisciplinary Information Sciences, Tsinghua University</b> in 2024, under the supervision of <a href="https://en.westlake.edu.cn/faculty/jianyang-zeng.html" target="_blank" style="color: inherit; text-decoration: underline;">Prof. Jianyang Zeng</a>.
  </p>
  <p>
    My research resides in the frontier of <b>AI for Life Science</b>, where I seek to develop <b>deep learning frameworks</b> to decipher the fundamental mechanisms governing complex biological systems. I am particularly interested in the <b>mechanistic and quantitative understanding of biological information flow</b>, exploring how molecular interactions across various scales collectively shape complex biological traits and human health.
  </p>
  <p>
    By integrating <b>multi-modal and multi-scale omics data</b> (including genomic, proteomic, metabolomic, single-cell, and spatially resolved profiles), my work aims to build unified computational frameworks that bridge the gap between microscopic molecular mechanisms and macroscopic phenotypic manifestations, ultimately empowering the next generation of precision medicine and drug discovery.
  </p>

short_bio_zh: >-
  <p>
    嗨！我是<b>南开大学数学科学学院</b>的助理教授。我于2024年在<b>清华大学交叉信息研究院 </b>获得博士学位，导师是 <a href="https://en.westlake.edu.cn/faculty/jianyang-zeng.html" target="_blank" style="color: inherit; text-decoration: underline;">曾坚阳教授</a>。
  </p>
  <p>
    我们的研究方向是<b>AI for Life Science</b>，致力于开发深度学习框架，以揭示复杂生物系统的根本机制。我们特别关注生物信息流的机制和定量理解，探索不同尺度上的分子相互作用如何共同塑造复杂的生物性状和人类健康。
  </p>
  <p>
    通过整合<b>多模态和多尺度组学数据</b>（包括基因组、蛋白质组、代谢组、单细胞和空间组学数据），我们致力于构建统一的计算框架，弥合微观分子机制与宏观表型表现之间的差距，最终赋能精准医学和药物发现的新一代方法。
  </p>

