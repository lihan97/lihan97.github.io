<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        关于我
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ site.data.profile.short_bio_zh }}
                        </div>
                        
                        <div class="alert alert-info mt-4" role="alert">
                            <strong>🎓 招生信息：</strong>欢迎对AI for life science方向感兴趣的科研实习生与研究生加入我们。如有兴趣，欢迎联系！
                        </div>
                        
                        {% if site.data.profile.cv_link %}
                            <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> 个人简历</a> <br/>
                        {% endif %}
                    </div>
        
                </div>
            </div>
        </div>        
    </div>
</div>
